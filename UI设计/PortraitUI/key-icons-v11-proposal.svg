<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900">
  <title>窄条连续底纹方案</title>
  <desc>172×320 逻辑画布按两倍展示。保持图标14×14像素区域及中心高度84、160、236，比较现有1像素笔画与建议2像素笔画。底纹为17像素宽连续长条，顶部与底部各留20像素，高280像素，保留上下渐变与左右直边；三个按钮之间使用两条短横线分隔。独立视觉方案，未接入固件。</desc>
  <defs>
    <style>
      text{font-family:'Segoe UI','Microsoft YaHei',sans-serif}
      .title{fill:#18392c;font-size:26px}.caption{fill:#526b60;font-size:16px}
      .label{fill:#234b38;font-size:19px}.white{fill:#f1f5f4}.muted{fill:#93aaa0}
      .green{fill:#b1ffd3}.blue{fill:#72c9ff}
      .old-icon{fill:none;stroke:#b0c7bc;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      .new-icon{fill:none;stroke:#d8f5e7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <linearGradient id="horizontal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.25"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="horizontal-mask" maskUnits="userSpaceOnUse" x="148" y="0" width="24" height="320">
      <rect x="148" width="24" height="320" fill="url(#horizontal)"/>
    </mask>
    <mask id="vertical-mask" maskUnits="userSpaceOnUse" x="148" y="0" width="24" height="320">
      <rect x="148" width="24" height="320" fill="url(#vertical)"/>
    </mask>
    <clipPath id="panel-clip"><rect width="172" height="320" rx="21"/></clipPath>
    <g id="base">
      <rect x="-1" y="-1" width="174" height="322" rx="22" fill="#293e33"/>
      <rect width="172" height="320" rx="21" fill="#080b0c"/>
    </g>
    <g id="edge-old" clip-path="url(#panel-clip)">
      <g mask="url(#horizontal-mask)"><rect x="148" width="24" height="320" fill="#0f1815" mask="url(#vertical-mask)"/></g>
    </g>
    <linearGradient id="inset-edge" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="300">
      <stop offset="0" stop-color="#080b0c"/>
      <stop offset="0.5" stop-color="#0C1E17"/>
      <stop offset="1" stop-color="#080b0c"/>
    </linearGradient>
    <linearGradient id="inset-border" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="300">
      <stop offset="0" stop-color="#080b0c"/>
      <stop offset="0.5" stop-color="#1B3427"/>
      <stop offset="1" stop-color="#080b0c"/>
    </linearGradient>
    <g id="edge-new" clip-path="url(#panel-clip)">
      <rect x="155" y="20" width="17" height="280" fill="url(#inset-edge)"/>
      <path d="M155.5 20V300M171.5 20V300" fill="none" stroke="url(#inset-border)" stroke-width="1"/>
      <path d="M157 122.5H170M157 198.5H170" fill="none" stroke="#63977d" stroke-width="1" stroke-linecap="butt"/>
    </g>
    <g id="home-content">
      <text x="12" y="21" class="white" font-size="14">PolaMiya</text>
      <g stroke="#a7bdb3" stroke-width="1" fill="none"><rect x="121" y="11" width="18" height="9" rx="1"/><path d="M141 13v5" stroke-width="2"/></g>
      <rect x="123" y="13" width="9" height="5" fill="#f1f5f4"/>
      <path d="M12 30H144" stroke="#293a32" stroke-width="0.5"/>
      <text x="12" y="51" class="green" font-size="10">FOCUS</text>
      <text x="86" y="51" class="blue" font-size="10">ACTUAL</text>
      <text x="12" y="96" class="green" font-size="28" font-family="monospace">2.50</text>
      <text x="75" y="92" class="white" font-size="19">/</text>
      <text x="86" y="96" class="blue" font-size="28" font-family="monospace">2.50</text>
      <g fill="none" stroke="#93aaa0" stroke-width="0.5">
        <path d="M14 150H112M117 150h3m5 0h3M14 147v7m22-7v7m13-7v7m26-7v7m19-7v7m18-7v7m27-7v7"/>
      </g>
      <g class="muted" font-size="8" text-anchor="middle">
        <text x="14" y="175">0</text><text x="36" y="175">1</text><text x="49" y="175">2</text>
        <text x="75" y="175">5</text><text x="94" y="175">10</text><text x="112" y="175">20</text><text x="139" y="175">INF</text>
      </g>
      <path d="M51 138h6l-3 6z" stroke="#b1ffd3" fill="none"/>
      <path d="M51 162h6l-3-6z" stroke="#72c9ff" fill="none"/>
      <text x="12" y="199" class="muted" font-size="10">RANGE m / 10s</text>
      <path d="M34 216H144M34 236H144M34 256H144" stroke="#293a32" stroke-width="0.5"/>
      <g class="muted" font-size="8"><text x="12" y="220">3</text><text x="12" y="259">2</text><text x="34" y="270">-10s</text><text x="144" y="270" text-anchor="end">NOW</text></g>
      <path d="M34 245l6-2 5 4 6-9 5 1 6-7 5 3 6-9 6 3 5 3 6-4 6 1 5 5 6-3 5 5 6-4 6 4 5-1h16" stroke="#b1ffd3" fill="none" stroke-width="0.9"/>
      <text x="12" y="289" class="white" font-size="10">UP 00:12:34</text>
      <text x="86" y="307" class="muted" font-size="8" text-anchor="middle">1/3 HOME</text>
    </g>
    <g id="setup-content">
      <text x="12" y="21" class="white" font-size="14">SETTINGS</text>
      <path d="M12 30H144" stroke="#293a32" stroke-width="0.5"/>
      <text x="12" y="63" class="muted" font-size="10">BACKLIGHT</text>
      <text x="65" y="109" class="muted" font-size="12">%</text>
      <rect x="12" y="128" width="130" height="4" rx="2" fill="#293e33"/>
      <rect x="12" y="128" width="104" height="4" rx="2" fill="#b1ffd3"/>
      <text x="86" y="307" class="muted" font-size="8" text-anchor="middle">3/3 SETUP</text>
    </g>
    <g id="old-navigation" class="old-icon">
      <path transform="translate(157 77)" d="M5 4l3 3-3 3"/>
      <path transform="translate(157 229)" d="M9 4L6 7l3 3"/>
      <g transform="translate(157 153)">
        <circle cx="7" cy="7" r="4"/><circle cx="7" cy="7" r="2"/>
        <path d="M7 1v2m0 8v2M1 7h2m8 0h2M2 2l2 2m6 6 2 2M2 12l2-2m6-6 2-2"/>
      </g>
    </g>
    <g id="new-navigation" class="new-icon">
      <path transform="translate(157 77)" d="M5 4l3 3-3 3"/>
      <path transform="translate(157 229)" d="M9 4L6 7l3 3"/>
    </g>
    <g id="gear" class="new-icon" transform="translate(157 153)">
      <circle cx="7" cy="7" r="3.5"/>
      <path d="M7 1v2m0 8v2M1 7h2m8 0h2M2.5 2.5l1 1m7 7 1 1m-9 0 1-1m7-7 1-1"/>
    </g>
    <g id="tune" class="new-icon" transform="translate(157 153)">
      <path d="M3 2v10M10 2v10M1 5h4m3 4h4"/>
    </g>
    <g id="edit-icons" class="new-icon">
      <path transform="translate(157 77)" d="M3 7h8M7 3v8"/>
      <path transform="translate(157 153)" d="M3 7l3 3 5-6" stroke="#b1ffd3"/>
      <path transform="translate(157 229)" d="M3 7h8"/>
    </g>
  </defs>
  <rect width="1560" height="900" fill="#edf2ee"/>
  <text x="42" y="44" class="title">深色窄条底纹 · 上下各留 20 px · 横线分隔</text>
  <text x="42" y="76" class="caption">172 × 320 逻辑像素，按 2 倍展示 · 图标区域 14 × 14 px · 连续底纹宽 17 px · 图标中心位置不变</text>
  <text x="42" y="119" class="label">当前样式 / HOME</text>
  <text x="422" y="119" class="label">建议样式 / HOME</text>
  <text x="802" y="119" class="label">建议样式 / SETUP</text>
  <text x="1182" y="119" class="label">建议样式 / EDIT</text>
  <g transform="translate(42 142) scale(2)"><use href="#base"/><use href="#edge-old"/><use href="#home-content"/><use href="#old-navigation"/></g>
  <g transform="translate(422 142) scale(2)"><use href="#base"/><use href="#edge-new"/><use href="#home-content"/><use href="#new-navigation"/><use href="#gear"/></g>
  <g transform="translate(802 142) scale(2)">
    <use href="#base"/><use href="#edge-new"/><use href="#setup-content"/>
    <text x="12" y="104" class="white" font-size="32">80</text><text x="12" y="160" class="muted" font-size="10">UNSAVED</text>
    <use href="#new-navigation"/><use href="#tune"/>
  </g>
  <g transform="translate(1182 142) scale(2)">
    <use href="#base"/><use href="#edge-new"/><use href="#setup-content"/>
    <text x="12" y="104" class="green" font-size="32">80</text><text x="12" y="174" class="green" font-size="10">EDITING</text>
    <text x="12" y="201" class="muted" font-size="10">UNSAVED</text><use href="#edit-icons"/>
  </g>
  <text x="42" y="817" class="caption">1 px 细线 · 灰绿图标</text>
  <text x="422" y="817" class="caption">2 px 主笔画 · 17 px 连续窄条</text>
  <text x="802" y="817" class="caption">两条短横线，分隔三个按键</text>
  <text x="1182" y="817" class="caption">加 / 完成 / 减，沿用现有语义</text>
  <text x="42" y="858" class="caption">底纹再压暗至 #0C1E17，宽 17 px、高 280 px，顶部与底部各留 20 px；保留上下渐变、直边及两条短横线。</text>
  <text x="42" y="883" class="caption">视觉方案，非固件截图；正文为布局示意。图标及底纹的最终效果需在实际屏幕上确认。</text>
</svg>
